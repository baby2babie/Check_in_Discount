<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>กล่องสุ่มรางวัล — หอพัก</title>
<link rel="stylesheet" href="style.css">
<!--
  Boot-mask style is kept inline here (not in style.css) per project convention —
  see SKILL3_2_2.md "Inline <style> in <head> preferred ... when minimizing complexity matters (e.g., boot-mask)".
  It suppresses the LINE in-app browser's flash-of-unstyled-content while init() decides
  which page (check-in grid vs paid page) to render, and is removed at the very end of init().
-->
<style>
  #boot-mask{
    position:fixed; inset:0; z-index:9999;
    background:#020617;
  }
</style>
</head>
<body>

  <!-- removed by app.js at the end of init(), once the correct page has fully rendered -->
  <div id="boot-mask"></div>

  <div id="toast" class="toast"></div>
  <div id="flash" class="flash"></div>
  <div id="lb-confetti" class="lb-confetti"></div>

  <!-- ============================================================
       DASHBOARD — check-in grid (default) or paid page (?paid=1)
       init() rewrites .dash-title text + hides .count-wrap for the paid page
       ============================================================ -->
  <main class="dashboard">

    <button id="btn-history" class="btn-history-icon" onclick="openHistoryOverlay()" aria-label="ประวัติการเปิดกล่อง">
      🕓
    </button>

    <div class="dash-title">
      <h1>กล่องสุ่มรางวัล</h1>
      <p>สะสมเช็คอินลุ้นรางวัลทุกเดือน</p>
    </div>

    <div id="lb-room-label" class="header-room"></div>

    <div class="count-wrap">
      <div class="count-badge">🎁 เปิดได้อีก <span id="lb-count">0</span> กล่อง</div>
    </div>

    <div id="lb-grid" class="lb-grid"></div>

    <div class="safe-bottom"></div>
  </main>

  <!-- ============================================================
       CHECK-IN TIER OVERLAY — silver / gold / plat / legend
       (solar-system spin, buildSolarHTML() fills #spin-stage)
       ============================================================ -->
  <div id="lb-overlay" class="lb-overlay">

    <div id="spin-wrap" style="position:relative; display:flex; align-items:center; justify-content:center;">
      <div id="spin-stage" class="spin-stage"></div>

      <!-- scattered glitch text, only shown for the legendary tier (cfg.glitch === true) -->
      <div id="err1" class="err-txt" style="top:12%; left:8%;">SYSTEM ERROR</div>
      <div id="err2" class="err-txt" style="top:50%; right:4%;">OVERLOAD</div>
      <div id="err3" class="err-txt" style="bottom:10%; left:50%; transform:translateX(-50%);">CRITICAL</div>
    </div>

    <div id="result-ui" class="result-ui">
      <div id="res-badge" class="res-badge">
        <span class="res-badge-sym">🎁</span>
      </div>
      <div class="res-label">รางวัลที่ได้รับ</div>
      <div id="res-tier-name" class="res-tier-name"></div>
      <div id="prize-val" class="prize-val">0</div>
      <div class="res-note">เพิ่มเข้ายอดส่วนลดรอบบิลถัดไปให้อัตโนมัติ</div>
      <button id="btn-claim" class="btn-claim" onclick="closeLootPopup()">เก็บรางวัล 🎉</button>
    </div>

  </div>

  <!-- ============================================================
       GACHAPON OVERLAY — PAID box only (traditional Japanese
       capsule-machine reveal). Silver/gold/plat/legend never touch this.
       ============================================================ -->
  <div id="paid-overlay" class="gp-overlay">
    <div class="gp-stage">

      <div id="gpCabinet" class="gp-cabinet">
        <div class="gp-sign">
          <span class="gp-sign-jp">ガシャポン</span>
          <span class="gp-sign-th">PAID BONUS</span>
        </div>

        <div class="gp-dome">
          <div class="gp-dome-shine"></div>
          <div id="gpPile" class="gp-pile"></div>
        </div>

        <div class="gp-crank-wrap">
          <div class="gp-crank-base"></div>
          <div id="gpCrank" class="gp-crank">
            <div class="gp-crank-arm"></div>
            <div class="gp-crank-knob"></div>
          </div>
        </div>

        <div id="gpChute" class="gp-chute"></div>
        <div class="gp-tray"></div>
      </div>

      <div id="gpHint" class="gp-hint">แตะที่ตู้เพื่อลุ้นรางวัล</div>

      <div id="gpResult" class="gp-result">
        <div id="gpCrackWrap" class="gp-crack-wrap">
          <div id="gpCrackTop" class="gp-crack-half top"></div>
          <div id="gpCrackBottom" class="gp-crack-half bottom"></div>
        </div>

        <div class="gp-ticket">
          <div id="gpRibbon" class="gp-ribbon">✓ ยินดีด้วย</div>
          <div class="gp-ticket-tier">PAID BONUS</div>
          <div id="paid-prize-val" class="gp-ticket-val">0</div>
          <div class="gp-ticket-unit">บาท</div>
          <div class="gp-ticket-note">ส่วนลดจะถูกหักในบิลรอบถัดไปให้อัตโนมัติ</div>
          <button class="btn-claim gp-claim" onclick="closePaidOverlay()">เก็บรางวัล 🎉</button>
        </div>
      </div>

    </div>
  </div>

  <!-- ============================================================
       HISTORY BOTTOM SHEET
       ============================================================ -->
  <div id="history-overlay" class="history-overlay">
    <div class="history-panel">
      <div class="history-header">
        <div class="history-title">🕓 ประวัติการเปิดกล่อง</div>
        <button class="history-close" onclick="closeHistoryOverlay()" aria-label="ปิด">✕</button>
      </div>
      <div id="history-body" class="history-body"></div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
