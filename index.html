<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>วงล้อส่วนลด</title>
  <meta name="description" content="เช็คอินครบ จ่ายบิลตรงเวลา แล้วมาหมุนวงล้อลุ้นส่วนลดค่าเช่า!">
  <meta name="theme-color" content="#F0F1EF">
  <meta property="og:title" content="วงล้อส่วนลด">
  <meta property="og:description" content="เช็คอินครบ จ่ายบิลตรงเวลา แล้วมาหมุนวงล้อลุ้นส่วนลดค่าเช่า!">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231C2320'/%3E%3Cpath d='M9 12.5A1.5 1.5 0 0 1 10.5 11h11a1.5 1.5 0 0 1 1.5 1.5V14a2 2 0 0 0 0 4v1.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 9 19.5V18a2 2 0 0 0 0-4z' fill='%23F0F1EF'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://static.line-scdn.net">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@200;300;400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="assets/logo.png" as="image">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js" defer></script>
  <style>
    /* boot mask อยู่ inline เพื่อให้ขึ้นทันทีก่อน style.css โหลดเสร็จ */
    #boot-mask {
      position: fixed; inset: 0; z-index: 9999;
      background: #F0F1EF;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px;
      font-family: 'Anuphan', 'Sarabun', system-ui, -apple-system, 'Noto Sans Thai', sans-serif;
      transition: opacity .35s ease;
    }
    #boot-mask.fade-out { opacity: 0; pointer-events: none; }
    #boot-mask .boot-ring {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid rgba(28, 35, 32, .14);
      border-top-color: #1C2320;
      animation: bootSpin .9s linear infinite;
    }
    #boot-mask .boot-text { font-size: 13px; color: #5E6864; }
    @keyframes bootSpin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot-mask .boot-ring { animation-duration: 3s; } }
  </style>
</head>
<body>

<div id="boot-mask" role="status">
  <div class="boot-ring"></div>
  <div class="boot-text">รอแป๊บนะ...</div>
</div>

<div class="app" id="revealCard" data-state="loading">

  <header class="topbar">
    <div class="brandrow">
      <img class="brand-logo" src="assets/logo.png" alt="โลโก้หอพัก">
      <div class="brand">
        <h1>วงล้อส่วนลด</h1>
        <p class="room" id="cabRoomBadge"></p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-music" type="button" aria-label="เปิด/ปิดเพลง" aria-pressed="false">
        <svg class="icon-music-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z"></path>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
          <path d="M18.5 6a9 9 0 0 1 0 12"></path>
        </svg>
        <svg class="icon-music-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4z"></path>
          <path d="M23 9 17 15"></path>
          <path d="M17 9l6 6"></path>
        </svg>
      </button>
      <button class="pill-btn" id="btn-history" type="button" onclick="openHistoryOverlay()" aria-label="ดูประวัติการหมุนวงล้อ">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
          <path d="M12 7v5l4 2"></path>
        </svg>
        <span>ประวัติ</span>
      </button>
    </div>
  </header>

  <audio id="bgm" loop preload="auto"></audio>

  <section class="status">
    <p class="title" id="titleText" aria-live="polite">กำลังเตรียมวงล้อ...</p>
    <p class="hint" id="hint"></p>
  </section>

  <main class="stage">
    <div class="board" id="board">
      <div class="wheel-shell">
        <div class="wheel-pointer" aria-hidden="true"></div>
        <canvas id="wheelCanvas" class="wheel-canvas" aria-hidden="true"></canvas>
        <div class="wheel-hub" aria-hidden="true">
          <span class="wheel-hub-num" id="stockCount">–</span>
          <span class="wheel-hub-label">สปินที่มี</span>
        </div>
      </div>

      <div class="ticket" id="ticket" role="group">
        <div class="ticket-paper">
          <div class="ticket-top">
            <p class="ticket-tier"><i class="ticket-dot"></i><span id="ticketTier">Coupon</span></p>
            <p class="ticket-amount"><span id="ticketAmount">0</span><small>฿</small></p>
            <p class="ticket-label">ลดค่าเช่า</p>
          </div>
          <div class="ticket-perf" aria-hidden="true"></div>
          <div class="ticket-bottom">
            <p id="ticketDesc">หักจากบิลรอบหน้าให้เอง ไม่ต้องทำอะไรเพิ่ม</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="dock">
    <p class="notice" id="instruction" aria-live="polite"></p>
    <button class="btn primary hide" id="startBtn" type="button">หมุนเลย!</button>
    <button class="btn primary claim" id="claimBtn" type="button">เก็บเข้ากระเป๋า ✨</button>
    <button class="btn ghost" id="retryBtn" type="button" style="display:none;">ลองอีกที</button>
  </div>

  <p class="footnote">สิทธิ์นี้สำหรับห้องที่เช่าอยู่ตามปกติเท่านั้น เงื่อนไขเป็นไปตามที่หอพักกำหนด และอาจเปลี่ยนแปลงได้โดยไม่แจ้งล่วงหน้า</p>
</div>

<div class="screen-flash" id="screenFlash" aria-hidden="true"></div>
<div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

<!-- HISTORY OVERLAY -->
<div class="history-overlay" id="history-overlay" role="dialog" aria-modal="true" aria-labelledby="history-title">
  <div class="history-panel">
    <span class="sheet-grip" aria-hidden="true"></span>
    <div class="history-header">
      <h2 class="history-title" id="history-title">ประวัติการหมุน</h2>
      <button class="icon-btn" id="history-close" type="button" onclick="closeHistoryOverlay()" aria-label="ปิด">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
    <div class="history-body" id="history-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js" defer></script>
</body>
</html>
